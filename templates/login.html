<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patitas Adopciones</title>  
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <div class="menu-toggle">
            <button id="DarkMode" class="mode-toggle">
                <i id="modeIcon" class="fas fa-sun"></i> <!-- Icono de sol por defecto -->
            </button>
            <h1>Patitas Adopciones</h1>
            <span>☰</span>
        </div>
        <nav>
            <ul class="menu">
                <li><a href="{{ url_for('index') }}">Inicio</a></li>
                <li><a href="{{ url_for('events_templates.events') }}">Eventos</a></li>
                <li><a href="{{url_for('nosotros')}}">Sobre Nosotros</a></li>
                <li><a href="{{url_for('contact')}}">Contacto</a></li>
                <li><a href="{{url_for('donations')}}">Donaciones</a></li>
                <li><a href="{{ url_for('login') }}">Login</a></li>
            </ul>
        </nav>
    </header>     
    <main class="main-login">
        <div class="login-container">
            <h2>Iniciar Sesión</h2>
            <form action="/auth" method="POST">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="mail" placeholder="Ingresa tu usuario" required>
    
                <label for="password">Contraseña</label>
                <div class="password-container">
                    <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                    <button type="button" id="togglePassword" class="toggle-password">
                        <img id="passwordIcon" src="/static/img/ojo.png" alt="Mostrar contraseña">
                    </button>
                </div>
                <label class="error-message" id="error-message" style="display: none;">Usuario o contraseña incorrectos</label>
                <button type="submit">Ingresar</button>
            </form>
        </div>
    </main>
    <footer>
        <p>&copy; 2024 Adopta un Amigo. Todos los derechos reservados. <a href="#">Política de privacidad</a></p>
        <p>Síguenos en <a id="Facebook" href="#">Facebook</a> | <a id="Instagram" href="#">Instagram</a> | <a id="Twitter" href="#">Twitter</a></p>
    </footer>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
